name: Build Windows Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies and PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Run unit tests
        run: |
          python -m unittest discover -s tests -v

      - name: Build RetroPlay.exe
        run: |
          pyinstaller --noconfirm --onefile --windowed --name RetroPlay main.py

      - name: Package release archive
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release_pkg/roms | Out-Null
          Copy-Item dist/RetroPlay.exe release_pkg/
          Copy-Item roms/README.md release_pkg/roms/
          Copy-Item README.md, LICENSE release_pkg/
          Compress-Archive -Path release_pkg/* -DestinationPath RetroPlay-NES-Windows.zip -Force

      - name: Attach to GitHub Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: RetroPlay-NES-Windows.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
